<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم الصور والفيديوهات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8eaff;
        }
        input[type="file"] {
            display: none;
        }
        .upload-text {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .upload-sub {
            color: #999;
            font-size: 14px;
        }
        .controls {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 15px;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            background: white;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        .button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .button:active {
            transform: scale(0.98);
        }
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result-title {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .extracted-text, .translated-text {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            word-wrap: break-word;
            line-height: 1.6;
            color: #333;
            max-height: 200px;
            overflow-y: auto;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            display: none;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #ffe6e6;
            color: #d32f2f;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .copy-btn {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 مترجم النصوص من الصور</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-text">📷 اختر صورة أو اسحبها هنا</div>
            <div class="upload-sub">JPG, PNG, WebP...</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="controls">
            <label for="targetLang">اختر لغة الترجمة:</label>
            <select id="targetLang">
                <option value="en">🇺🇸 English</option>
                <option value="ar">🇸🇦 العربية</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
            <button class="button" id="translateBtn">ترجم النص 🚀</button>
        </div>

        <div class="error" id="errorMsg"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>جاري المعالجة...</p>
        </div>

        <div class="result" id="result">
            <img id="preview" class="image-preview">
            <div>
                <div class="result-title">النص المستخرج:</div>
                <div class="extracted-text" id="extractedText"></div>
                <button class="copy-btn" onclick="copyToClipboard('extractedText')">نسخ النص</button>
            </div>
            <div>
                <div class="result-title">النص المترجم:</div>
                <div class="translated-text" id="translatedText"></div>
                <button class="copy-btn" onclick="copyToClipboard('translatedText')">نسخ الترجمة</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
    <script>
        let selectedFile = null;

        // Upload area interactions
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('الرجاء اختيار صورة صحيحة');
                return;
            }
            selectedFile = file;
            uploadArea.style.opacity = '0.6';
            uploadArea.querySelector('.upload-text').textContent = '✅ تم اختيار الصورة';
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Translation
        document.getElementById('translateBtn').addEventListener('click', async () => {
            if (!selectedFile) {
                showError('الرجاء اختيار صورة أولاً');
                return;
            }

            showLoading(true);
            hideError();

            try {
                // Extract text using Tesseract
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const result = await Tesseract.recognize(e.target.result, 'ara+eng');
                    const extractedText = result.data.text;
                    document.getElementById('extractedText').textContent = extractedText || 'لم يتم العثور على نصوص';

                    if (extractedText) {
                        // Translate
                        const targetLang = document.getElementById('targetLang').value;
                        await translateText(extractedText, targetLang);
                    }
                    showLoading(false);
                    document.getElementById('result').classList.add('show');
                };
                reader.readAsDataURL(selectedFile);
            } catch (error) {
                showError('حدث خطأ: ' + error.message);
                showLoading(false);
            }
        });

        async function translateText(text, targetLang) {
            try {
                const response = await fetch(
                    `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=auto|${targetLang}`
                );
                const data = await response.json();
                if (data.responseStatus === 200) {
                    document.getElementById('translatedText').textContent = data.responseData.translatedText;
                } else {
                    showError('فشلت الترجمة');
                }
            } catch (error) {
                showError('خطأ في الاتصال: ' + error.message);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
            document.getElementById('translateBtn').disabled = show;
        }

        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('تم النسخ! ✅');
            });
        }
    </script>
</body>
</html>
