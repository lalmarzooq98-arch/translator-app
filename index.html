<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترجمة الفيديو مع الكتابة</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.1/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .upload-section {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: #f9f9f9;
        }
        
        .upload-section:hover {
            background: #f0f0f0;
            border-color: #764ba2;
        }
        
        .upload-section input {
            display: none;
        }
        
        .upload-text {
            font-size: 1.1em;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        select, input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .progress-container {
            margin: 20px 0;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status-text {
            text-align: center;
            color: #666;
            font-weight: bold;
        }
        
        .results {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }
        
        .results.show {
            display: block;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .video-preview {
            width: 100%;
            display: block;
        }
        
        .download-btn {
            background: #28a745;
            padding: 12px 25px;
            margin-top: 15px;
            width: 100%;
        }
        
        .download-btn:hover {
            background: #218838;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }
        
        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 ترجمة الفيديو + الكتابة</h1>
        
        <div class="upload-section" id="uploadArea">
            <input type="file" id="videoInput" accept="video/*">
            <div class="upload-text">📹 اسحب الفيديو هنا أو اضغط للاختيار</div>
            <small>صيغ مدعومة: MP4, WebM</small>
        </div>
        
        <div class="controls">
            <select id="sourceLanguage">
                <option value="ara">العربية (مصدر)</option>
                <option value="eng">English (Source)</option>
                <option value="fra">Français (Source)</option>
                <option value="spa">Español (Source)</option>
            </select>
            
            <select id="targetLanguage">
                <option value="eng">English (الهدف)</option>
                <option value="ara">العربية (الهدف)</option>
                <option value="fra">Français (الهدف)</option>
                <option value="spa">Español (الهدف)</option>
            </select>
        </div>
        
        <button id="processBtn" disabled>🚀 ابدأ الترجمة والكتابة</button>
        
        <div class="error" id="errorMessage"></div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText">جاري المعالجة...</div>
        </div>
        
        <div class="results" id="results">
            <h2>📊 الفيديو المترجم</h2>
            <div class="video-container">
                <video class="video-preview" id="videoPreview" controls></video>
            </div>
            <button class="download-btn" id="downloadBtn">⬇️ تحميل الفيديو</button>
        </div>
    </div>

    <script>
        const { FFmpeg, fetchFile } = FFmpeg;
        const fmpeg = new FFmpeg.FFmpeg();

        const uploadArea = document.getElementById('uploadArea');
        const videoInput = document.getElementById('videoInput');
        const processBtn = document.getElementById('processBtn');
        const sourceLanguage = document.getElementById('sourceLanguage');
        const targetLanguage = document.getElementById('targetLanguage');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const errorMessage = document.getElementById('errorMessage');
        const results = document.getElementById('results');
        const videoPreview = document.getElementById('videoPreview');
        const downloadBtn = document.getElementById('downloadBtn');

        let selectedVideo = null;
        let outputVideoBlob = null;

        // تحميل FFmpeg
        async function loadFFmpeg() {
            if (!fmpeg.isLoaded()) {
                await fmpeg.load();
            }
        }

        // اختيار الفيديو
        uploadArea.addEventListener('click', () => videoInput.click());
        
        videoInput.addEventListener('change', (e) => {
            selectedVideo = e.target.files[0];
            processBtn.disabled = !selectedVideo;
            results.classList.remove('show');
        });

        // استخراج النصوص من الفيديو (كل ثانية)
        async function extractFrames(videoBlob) {
            const video = document.createElement('video');
            video.src = URL.createObjectURL(videoBlob);
            
            return new Promise((resolve) => {
                video.onloadedmetadata = async () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const frames = [];
                    const fps = 1; // نقتل كل ثانية
                    const duration = video.duration;
                    
                    for (let time = 0; time < duration; time += 1) {
                        video.currentTime = time;
                        
                        await new Promise(r => {
                            video.oncanplay = () => {
                                canvas.width = video.videoWidth;
                                canvas.height = video.videoHeight;
                                ctx.drawImage(video, 0, 0);
                                frames.push({
                                    time: time,
                                    imageData: canvas.toDataURL('image/jpeg', 0.8)
                                });
                                r();
                            };
                        });
                    }
                    
                    resolve(frames);
                };
            });
        }

        // استخراج النصوص باستخدام Tesseract
        async function performOCR(frames) {
            const texts = [];
            const total = frames.length;
            
            for (let i = 0; i < total; i++) {
                statusText.textContent = `🔍 استخراج النصوص... ${i + 1}/${total}`;
                progressFill.style.width = ((i + 1) / total * 33) + '%';
                
                try {
                    const result = await Tesseract.recognize(frames[i].imageData, sourceLanguage.value);
                    
                    if (result.data.text.trim()) {
                        texts.push({
                            time: frames[i].time,
                            text: result.data.text.trim()
                        });
                    }
                } catch (e) {
                    console.error('OCR Error:', e);
                }
            }
            
            return texts;
        }

        // ترجمة النصوص
        async function translateTexts(texts) {
            const translations = [];
            const total = texts.length;
            
            for (let i = 0; i < total; i++) {
                statusText.textContent = `🌐 ترجمة النصوص... ${i + 1}/${total}`;
                progressFill.style.width = (33 + (i + 1) / total * 33) + '%';
                
                try {
                    const response = await fetch(
                        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(texts[i].text)}&langpair=${sourceLanguage.value}|${targetLanguage.value}`
                    );
                    
                    const data = await response.json();
                    
                    translations.push({
                        time: texts[i].time,
                        original: texts[i].text,
                        translated: data.responseData.translatedText
                    });
                } catch (e) {
                    translations.push({
                        time: texts[i].time,
                        original: texts[i].text,
                        translated: texts[i].text
                    });
                }
                
                // تأخير صغير لعدم ضغط السيرفر
                await new Promise(r => setTimeout(r, 200));
            }
            
            return translations;
        }

        // إنشاء نص الفيديو بـ FFmpeg
        async function createSubtitlesFile(subtitles) {
            let srt = '';
            
            subtitles.forEach((sub, index) => {
                const startTime = formatTime(sub.time);
                const endTime = formatTime(sub.time + 2);
                
                srt += `${index + 1}\n`;
                srt += `${startTime} --> ${endTime}\n`;
                srt += `${sub.translated}\n\n`;
            });
            
            return srt;
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 1000);
            
            return `${pad(hours)}:${pad(minutes)}:${pad(secs)},${pad(ms, 3)}`;
        }

        function pad(num, size = 2) {
            let s = num + '';
            while (s.length < size) s = '0' + s;
            return s;
        }

        // معالجة الفيديو الرئيسية
        processBtn.addEventListener('click', async () => {
            if (!selectedVideo) return;
            
            try {
                errorMessage.style.display = 'none';
                processBtn.disabled = true;
                progressContainer.style.display = 'block';
                results.classList.remove('show');
                
                // تحميل FFmpeg
                await loadFFmpeg();
                
                // 1. استخراج الإطارات
                statusText.textContent = '📹 جاري استخراج الإطارات...';
                const frames = await extractFrames(selectedVideo);
                
                // 2. OCR
                const texts = await performOCR(frames);
                
                // 3. الترجمة
                const translations = await translateTexts(texts);
                
                // 4. إنشاء ملف الترجمة
                statusText.textContent = '📝 جاري إنشاء ملف الترجمة...';
                const srtContent = await createSubtitlesFile(translations);
                
                // 5. إضافة الترجمة على الفيديو
                statusText.textContent = '🎬 جاري إضافة الترجمة على الفيديو...';
                progressFill.style.width = '66%';
                
                await fmpeg.writeFile('input.mp4', await fetchFile(selectedVideo));
                await fmpeg.writeFile('subtitles.srt', srtContent);
                
                // تطبيق الفلتر لإضافة الترجمة
                await fmpeg.exec([
                    '-i', 'input.mp4',
                    '-vf', `subtitles=subtitles.srt:force_style='Fontsize=20,Fontname=Arial,PrimaryColour=&HFFFFFF&,BorderStyle=1,BackColour=&H000000&,Bold=1'`,
                    '-y',
                    'output.mp4'
                ]);
                
                statusText.textContent = '💾 جاري حفظ الفيديو...';
                progressFill.style.width = '90%';
                
                // قراءة الفيديو الناتج
                const data = await fmpeg.readFile('output.mp4');
                outputVideoBlob = new Blob([data.buffer], { type: 'video/mp4' });
                
                // عرض النتيجة
                displayResults();
                progressFill.style.width = '100%';
                statusText.textContent = '✅ تم!';
                
            } catch (error) {
                console.error('Error:', error);
                errorMessage.style.
